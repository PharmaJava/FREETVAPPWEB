# Builds everything and publishes the downloads (GitHub Pages serves the web page itself straight from main's root):
#   - FreeTV's packages for LG, from PharmaJava/FreeTV (FREETV_REF), the same way FreeTV's install.sh builds them,
#   - the Android app (android/), with those packages and the web page inside,
#   - FreeTV for Windows (the computer program, also for macOS and Linux), with the same inside,
#   - all of them on the release "descargas", the one the web page links to.
# Runs on every push to main, by hand (Actions → Build and publish → Run workflow), and every 6 hours: then it only builds when
# FreeTV (FREETV_REPO) has a newer commit than the one the downloads on the release were built from (freetv-version.txt there), so a
# change in FreeTV reaches the downloads by itself. (GitHub pauses scheduled runs of a repository with no activity for 60 days: any
# push or a manual run starts them again.)
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

env:
  FREETV_REPO: PharmaJava/FreeTV
  FREETV_REF: main
  NODE_VERSION: '22.20.0'
  RELEASE_TAG: descargas

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git ls-remote "https://github.com/$FREETV_REPO" "refs/heads/$FREETV_REF" | cut -f1)
          built=$(gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p freetv-version.txt -O - 2>/dev/null || true)
          echo "FreeTV now: $latest · downloads built from: ${built:-nothing yet}"
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ -z "$latest" ] || [ "$latest" != "$built" ]; then build=true; else build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build: $build" >> "$GITHUB_STEP_SUMMARY"

  bundle:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FREETV_REPO }}
          ref: ${{ env.FREETV_REF }}
          path: freetv
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FreeTV's Samsung author certificate from earlier builds
        # Samsung TVs of 2017-2022 only update an app signed with the same author certificate: it is made once and kept on the
        # "datos-compilacion" release (a pre-release the web page does not link to).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-data
          gh release download datos-compilacion --repo "$GITHUB_REPOSITORY" -p tizen-author.json -D build-data || echo "none yet: one is made now"
      - name: Build FreeTV's packages
        env:
          TIZEN_AUTHOR: ${{ github.workspace }}/build-data/tizen-author.json
        run: |
          bash connector/scripts/build-bundle.sh "$GITHUB_WORKSPACE/freetv"
          echo "FreeTV commit in these downloads: $(git -C freetv log -1 --format='%h %s')" | tee -a "$GITHUB_STEP_SUMMARY"
          test -f connector/bundle/samsung/certs.json && echo "Samsung: FreeTV.wgt and its certificates are in" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Samsung's certificate service answers (for 2023+ TVs)
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w 'svdca.samsungqbe.com: HTTP %{http_code}, TLS verify %{ssl_verify_result}\n' https://svdca.samsungqbe.com/apis/v3/authors | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test the install against a pretend TV
        working-directory: connector
        run: npm ci --no-audit --no-fund && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: connector/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: build-data
          path: build-data/
          if-no-files-found: ignore

  android:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: connector/bundle/
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The pretend TV's libraries (for the tests)
        working-directory: connector
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test the installer and build the app
        working-directory: android
        run: gradle --no-daemon :core:test :app:assembleRelease
      - name: Name the download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/FreeTV-Android.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: download-android
          path: dist/

  android-emulator:
    # The app on a real Android (an emulator), as a person uses it, against a pretend LG TV running on this machine
    # (the emulator reaches it as 10.0.2.2): EmulatorInstallTest. The oldest Android we support is 8 (API 26); 9 and 14 stand for the range.
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: connector/bundle/
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the pretend TV
        working-directory: connector
        run: |
          npm ci --no-audit --no-fund
          ICON_HOST=10.0.2.2 nohup node test/fake-tv-daemon.js > ../fake-tv.log 2>&1 &
          for i in $(seq 1 20); do grep -q READY ../fake-tv.log && break; sleep 1; done
          cat ../fake-tv.log
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon -p android :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-emulator-report-${{ matrix.api }}
          path: android/app/build/reports/androidTests/

  connector:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: connector/bundle/
      - name: Build the Conector
        working-directory: connector
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-exe.js
      - name: Intel Mac too (same Node version, built here)
        if: runner.os == 'macOS'
        working-directory: connector
        run: |
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-darwin-x64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          node scripts/build-exe.js --node "$RUNNER_TEMP/node-v$NODE_VERSION-darwin-x64/bin/node" --name Mac-Intel
      - name: Test the packed program end to end (Windows, Mac and Linux)
        # The very file people download, opened the way they open it, installing on a pretend LG TV: the page it serves, finding the
        # TV, a wrong passphrase refused, the right one installing both packages and configuring the helper (connector/test/e2e.js).
        working-directory: connector
        shell: bash
        run: |
          exe=$(ls dist/FreeTV-* | grep -v Intel | head -1)
          echo "Testing $exe"
          node test/e2e.js "$exe"
      - name: Mac downloads as .zip (keeps the "can run" bit)
        if: runner.os == 'macOS'
        working-directory: connector/dist
        run: |
          for arch in AppleSilicon Intel; do
            mkdir -p "zip-$arch" && cp "FreeTV-Mac-$arch" "zip-$arch/FreeTV"
            (cd "zip-$arch" && zip -q -X "../FreeTV-Mac-$arch.zip" FreeTV)
            rm -rf "zip-$arch" "FreeTV-Mac-$arch"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ runner.os }}
          path: connector/dist/

  publish:
    needs: [android, android-emulator, connector]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: download-*
          path: downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-data
          path: build-data
      - name: Keep FreeTV's Samsung author certificate for the next builds
        if: hashFiles('build-data/tizen-author.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view datos-compilacion >/dev/null 2>&1; then
            gh release create datos-compilacion --prerelease --title "Datos de compilación" \
              --notes "Lo que la compilación guarda entre una vez y otra (el certificado de autor de FreeTV para Samsung). No es una descarga."
          fi
          gh release upload datos-compilacion build-data/tizen-author.json --clobber
      - name: Note which FreeTV these downloads carry
        run: python3 -c "import json; print(json.load(open('bundle/bundle.json'))['freetv'])" > downloads/freetv-version.txt
      - name: Put the downloads on the "descargas" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l downloads
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Descargas de FreeTV" --latest \
              --notes "La app de Android y el Conector para ordenador. Empieza en la web: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          gh release upload "$RELEASE_TAG" downloads/* --clobber
          # Files of earlier builds that are no longer made (renamed ones) go away, so the page never links to an old one.
          for old in $(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); do
            [ -e "downloads/$old" ] || gh release delete-asset "$RELEASE_TAG" "$old" -y
          done
