# Builds everything and publishes the downloads (GitHub Pages serves the web page itself straight from main's root):
#   - FreeTV's packages for LG, from PharmaJava/FreeTV (FREETV_REF), the same way FreeTV's install.sh builds them,
#   - the Android app (android/), with those packages and the web page inside,
#   - FreeTV Conector for Windows, macOS (Apple Silicon and Intel) and Linux, with the same inside,
#   - all of them on the release "descargas", the one the web page links to.
# Runs on every push to main, and by hand (Actions → Build and publish → Run workflow) to pick up a new FreeTV.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FREETV_REPO: PharmaJava/FreeTV
  FREETV_REF: main
  NODE_VERSION: '22.20.0'
  RELEASE_TAG: descargas

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FREETV_REPO }}
          ref: ${{ env.FREETV_REF }}
          path: freetv
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build FreeTV's packages
        run: bash connector/scripts/build-bundle.sh "$GITHUB_WORKSPACE/freetv"
      - name: Test the install against a pretend TV
        working-directory: connector
        run: npm ci --no-audit --no-fund && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: connector/bundle/

  android:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: connector/bundle/
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The pretend TV's libraries (for the tests)
        working-directory: connector
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test the installer and build the app
        working-directory: android
        run: gradle --no-daemon :core:test :app:assembleRelease
      - name: Name the download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/FreeTV-Android.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: download-android
          path: dist/

  connector:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: connector/bundle/
      - name: Build the Conector
        working-directory: connector
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-exe.js
      - name: Intel Mac too (same Node version, built here)
        if: runner.os == 'macOS'
        working-directory: connector
        run: |
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-darwin-x64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          node scripts/build-exe.js --node "$RUNNER_TEMP/node-v$NODE_VERSION-darwin-x64/bin/node" --name Mac-Intel
      - name: Mac downloads as .zip (keeps the "can run" bit)
        if: runner.os == 'macOS'
        working-directory: connector/dist
        run: |
          for arch in AppleSilicon Intel; do
            mkdir -p "zip-$arch" && cp "FreeTV-Conector-Mac-$arch" "zip-$arch/FreeTV-Conector"
            (cd "zip-$arch" && zip -q -X "../FreeTV-Conector-Mac-$arch.zip" FreeTV-Conector)
            rm -rf "zip-$arch" "FreeTV-Conector-Mac-$arch"
          done
      - name: Check that it starts
        if: runner.os == 'Linux'
        working-directory: connector/dist
        run: |
          FREETV_NO_BROWSER=1 ./FreeTV-Conector-Linux & sleep 3
          curl -fsS http://127.0.0.1:47321/api/hello | grep '"ready":true'
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ runner.os }}
          path: connector/dist/

  publish:
    needs: [android, connector]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: download-*
          path: downloads
          merge-multiple: true
      - name: Put the downloads on the "descargas" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l downloads
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Descargas de FreeTV" --latest \
              --notes "La app de Android y el Conector para ordenador. Empieza en la web: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          gh release upload "$RELEASE_TAG" downloads/* --clobber
